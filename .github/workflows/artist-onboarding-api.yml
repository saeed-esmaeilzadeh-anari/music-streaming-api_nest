name: Artist onboarding API checks

on:
  push:
    branches:
      - feature/artist-onboarding-upload-flow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and NestJS build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Build API
        run: npm run build
