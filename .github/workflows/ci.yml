name: Backend CI

on:
  push:
    branches: [main, "finalize/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_streaming_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint (formatting debt reported as warnings)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --rule 'prettier/prettier:warn'
      - name: Build
        run: npm run build
      - name: Unit tests with coverage
        run: npm test -- --runInBand --coverage
